[project]
name = "mcpp"
version = "0.1.0"
description = "An MCP-based chatbot and research server for paper discovery and tool orchestration."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "arxiv>=4.0.0",
    "mcp>=1.27.1",
    "nest-asyncio>=1.6.0",
    "openai>=1.0.0",
    "python-dotenv>=1.2.2",
]

[project.scripts]
mcpp = "main:main"
